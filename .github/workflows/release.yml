name: Release

# A pushed `v*` tag (made by `cz bump`) becomes a GitHub Release whose notes are that
# version's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { printing = ($2 == tag) }
            printing
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "No changelog section for ${GITHUB_REF_NAME}." > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
